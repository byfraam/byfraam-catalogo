<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>by Fraam Studio — Administración</title><style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#111;--muted:#777;--line:#e7e7e7}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{background:#111;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:1px}.brand small{display:block;color:#bbb;font-size:11px;letter-spacing:2px;margin-top:3px}main{max-width:1200px;margin:auto;padding:32px 5% 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px}.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tier{border:1px solid #ddd;border-radius:10px;padding:10px}.tier input{width:100%;padding:9px;border:1px solid #ddd;border-radius:7px;margin-top:7px}.btn{border:0;border-radius:8px;padding:11px 14px;background:#111;color:#fff;cursor:pointer;font-weight:700}.btn.secondary{background:#eee;color:#111}.btn.danger{background:#9c2222}.actions{display:flex;gap:8px;flex-wrap:wrap}.product{display:flex;gap:15px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.thumb{width:60px;height:60px;background:#eee;border-radius:8px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.grow{flex:1}.muted{color:#777;font-size:12px}.hidden{display:none!important}.login{max-width:430px;margin:70px auto}.notice{padding:12px;background:#f0f0f0;border-radius:8px;color:#555;font-size:13px;line-height:1.5}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 16px;border-radius:9px;display:none}@media(max-width:700px){.fields,.tiers{grid-template-columns:1fr 1fr}.product{flex-wrap:wrap}}
</style></head><body><header><div class="brand">by Fraam Studio<small>ADMINISTRACIÓN</small></div><button id="logout" class="btn secondary hidden" onclick="logout()">Cerrar sesión</button></header>
<main><section id="login" class="login panel"><h1>Acceso privado</h1><p class="muted">Panel de administración del catálogo.</p><div class="field"><label>Email</label><input id="email" type="email"></div><br><div class="field"><label>Contraseña</label><input id="password" type="password"></div><br><button class="btn" onclick="login()">Ingresar</button><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="panel"><h1>Administración</h1><p class="muted">Los cambios guardados acá aparecen en el catálogo público.</p></div>
<div class="panel"><h2>Configuración</h2><div class="tiers" id="tiers"></div><br><div class="fields"><div class="field"><label>Redondeo</label><select id="rounding"><option value="1">Sin redondeo</option><option value="10">$10</option><option value="100">$100</option><option value="500">$500</option><option value="1000">$1.000</option></select></div><div class="field"><label>WhatsApp</label><input id="wa" placeholder="549385..."></div><div class="field"><label>Nombre comercial</label><input id="bizName"></div><div class="field"><label>Ubicación</label><input id="bizAddress"></div><div class="field"><label>Instagram</label><input id="bizInstagram"></div><div class="field"><label>Logo / imagen (opcional)</label><input id="logo" type="file" accept="image/*"></div><div class="field full"><label>Texto comercial</label><textarea id="bizText" rows="2"></textarea></div><div class="field full"><label>Clientes</label><textarea id="bizClients" rows="2"></textarea></div><div class="field full"><label>Condiciones comerciales</label><textarea id="bizTerms" rows="3"></textarea></div></div><br><button class="btn" onclick="saveSettings()">Guardar configuración</button></div>
<div class="panel"><h2 id="formTitle">Nuevo producto</h2><div class="fields"><div class="field"><label>Nombre</label><input id="name"></div><div class="field"><label>Categoría</label><input id="category"></div><div class="field full"><label>Descripción</label><textarea id="description" rows="3"></textarea></div><div class="field"><label>Costo</label><input id="cost" type="number" step="0.01" min="0"></div><div class="field"><label>Stock</label><input id="stock" type="number" step="1" min="0"></div><div class="field full"><label>Imagen</label><input id="image" type="file" accept="image/*"><div id="preview" class="notice">Vista previa</div></div></div><br><div class="actions"><button class="btn" onclick="saveProduct()">Guardar producto</button><button class="btn secondary" onclick="clearForm()">Limpiar</button></div></div>
<div class="panel"><h2>Productos</h2><div id="list"></div></div></section></main><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://ruwpvinhnnuiyqdrzmqf.supabase.co';const SUPABASE_KEY='sb_publishable_ho5CaH2v7E0ikXS2BfIUag_Nupt2xOr';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const tiers=[1,10,20,50,100,250,500];let products=[],editingId=null,currentImage='';const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function esc(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function login(){let {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){document.getElementById('loginMsg').textContent='Email o contraseña incorrectos.';return}showApp()}async function logout(){await supabaseClient.auth.signOut();location.reload()}async function init(){let {data}=await supabaseClient.auth.getSession();if(data.session)showApp()}async function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('logout').classList.remove('hidden');await loadSettings();await loadProducts()}
async function loadSettings(){let {data,error}=await supabaseClient.from('settings').select('*').eq('id',1).maybeSingle();if(error){toast(error.message);return}if(!data)return;document.getElementById('rounding').value=data.rounding||1;document.getElementById('wa').value=data.wa||'';document.getElementById('bizName').value=data.biz_name||'by Fraam Studio';document.getElementById('bizAddress').value=data.biz_address||'';document.getElementById('bizInstagram').value=data.biz_instagram||'';document.getElementById('bizText').value=data.biz_text||'';document.getElementById('bizClients').value=data.biz_clients||'';document.getElementById('bizTerms').value=data.biz_terms||'';document.getElementById('tiers').innerHTML=tiers.map(t=>`<div class="tier"><b>X${t}</b><input id="pct${t}" type="number" step="0.01" value="${data['percent_x'+t]||0}"></div>`).join('')}
async function saveSettings(){let o={rounding:Number(document.getElementById('rounding').value),wa:document.getElementById('wa').value.trim(),biz_name:document.getElementById('bizName').value.trim()||'by Fraam Studio',biz_address:document.getElementById('bizAddress').value.trim(),biz_instagram:document.getElementById('bizInstagram').value.trim(),biz_text:document.getElementById('bizText').value.trim(),biz_clients:document.getElementById('bizClients').value.trim(),biz_terms:document.getElementById('bizTerms').value.trim()};tiers.forEach(t=>o['percent_x'+t]=Number(document.getElementById('pct'+t).value||0));let f=document.getElementById('logo').files[0];if(f)o.logo_url=await dataUrl(f);let {error}=await supabaseClient.from('settings').update(o).eq('id',1);if(error)toast(error.message);else toast('Configuración guardada')}
async function loadProducts(){let {data,error}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});if(error){toast(error.message);return}products=data||[];renderProducts()}
async function dataUrl(file){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function saveProduct(){let name=document.getElementById('name').value.trim(),cost=Number(document.getElementById('cost').value||0);if(!name||!cost){toast('Completá nombre y costo');return}let f=document.getElementById('image').files[0],image_url=currentImage;if(f)image_url=await dataUrl(f);let o={name,category:document.getElementById('category').value.trim()||'Sin categoría',description:document.getElementById('description').value.trim(),cost,stock:document.getElementById('stock').value===''?null:Number(document.getElementById('stock').value),image_url,active:true};let r=editingId?await supabaseClient.from('products').update(o).eq('id',editingId):await supabaseClient.from('products').insert(o);if(r.error)toast(r.error.message);else{toast(editingId?'Producto actualizado':'Producto guardado');clearForm();loadProducts()}}
function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;editingId=id;currentImage=p.image_url||'';document.getElementById('formTitle').textContent='Editar producto';document.getElementById('name').value=p.name;document.getElementById('category').value=p.category||'';document.getElementById('description').value=p.description||'';document.getElementById('cost').value=p.cost;document.getElementById('stock').value=p.stock??'';document.getElementById('preview').innerHTML=p.image_url?`<img src="${p.image_url}" style="max-width:180px;max-height:180px">`:'Vista previa';window.scrollTo({top:0,behavior:'smooth'})}
async function deleteProduct(id){if(!confirm('¿Eliminar este producto?'))return;let {error}=await supabaseClient.from('products').delete().eq('id',id);if(error)toast(error.message);else{toast('Producto eliminado');loadProducts()}}function clearForm(){editingId=null;currentImage='';document.getElementById('formTitle').textContent='Nuevo producto';['name','category','description','cost','stock'].forEach(id=>document.getElementById(id).value='');document.getElementById('image').value='';document.getElementById('preview').textContent='Vista previa'}function renderProducts(){document.getElementById('list').innerHTML=products.length?products.map(p=>`<div class="product"><div class="thumb">${p.image_url?`<img src="${p.image_url}">`:''}</div><div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · Costo ${money(p.cost)}</div></div><div class="actions"><button class="btn secondary" onclick="editProduct(${p.id})">Editar</button><button class="btn danger" onclick="deleteProduct(${p.id})">Eliminar</button></div></div>`).join(''):'<div class="muted">No hay productos cargados.</div>'}
init();
</script></body></html>
